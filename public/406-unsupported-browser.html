<!doctype html>
<html lang="tr">
  <head>
    <title>406 · Tarayıcınız Desteklenmiyor | Kleomarcus</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #c62828;
        --surface: #ffffff;
        --content: #263238;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #e53935;
          --surface: #1e1e1e;
          --content: #e0e0e0;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
        background: var(--surface);
        color: var(--content);
        font-family: "Ubuntu", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      .wordmark {
        margin-bottom: 3rem;
        font-family: "Russo One", ui-sans-serif, system-ui, sans-serif;
        font-size: 1.5rem;
        color: var(--primary);
        text-decoration: none;
      }

      .code {
        margin: 0;
        font-family: "Russo One", ui-sans-serif, system-ui, sans-serif;
        font-size: 4.5rem;
        line-height: 1;
        color: var(--primary);
      }

      .rule {
        width: 8rem;
        height: 3px;
        margin: 1.75rem 0;
        background: linear-gradient(
          to right,
          transparent,
          var(--primary),
          transparent
        );
      }

      h1 {
        margin: 0 0 0.75rem;
        font-family: "Russo One", ui-sans-serif, system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 400;
      }

      .message {
        max-width: 34rem;
        margin: 0;
        opacity: 0.7;
      }

      .contact {
        margin: 2.5rem 0 0;
        font-size: 0.8125rem;
        opacity: 0.5;
      }

      .contact a {
        color: inherit;
      }

      @media (min-width: 640px) {
        .code {
          font-size: 6rem;
        }
        h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <p class="wordmark">KLEOMARCUS</p>

    <p class="code">406</p>
    <div class="rule"></div>

    <h1>Tarayıcınız Desteklenmiyor</h1>
    <p class="message">
      Bu site, tarayıcınızın desteklemediği güncel web özelliklerini kullanıyor.
      Tarayıcınızı güncelledikten sonra tekrar deneyebilirsiniz.
    </p>

    <p class="contact">
      Bize <a href="https://wa.me/905470230899">WhatsApp</a> üzerinden de
      ulaşabilirsiniz.
    </p>
  </body>
</html>
